name: Publish Linux multi-window release

on:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/linux-build.yml
  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: multiple-windows-linux-x64-*
          merge-multiple: true
          path: dist
      - name: Verify release bundles
        working-directory: dist
        shell: bash
        run: |
          shopt -s nullglob
          bundles=(*.tar.gz)
          checksums=(*.tar.gz.sha256)
          test "${#bundles[@]}" -eq 2
          test "${#checksums[@]}" -eq 2
          for variant in gtk3 gtk4; do
            matches=(multiple-windows-linux-x64-"$variant"-*.tar.gz)
            test "${#matches[@]}" -eq 1
            sha256sum --check "${matches[0]}.sha256"
          done
      - name: Publish tagged bundles
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" --verify-tag --generate-notes \
            dist/*.tar.gz dist/*.tar.gz.sha256
